name: Deploy site

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    # Daily rebuild, purely to refresh the Google Scholar citation counts. They are
    # baked into the HTML at build time (Google publishes no citations API), and the
    # refresh step below regenerates _data/citations.yml in the runner without
    # committing it -- so counts stay current without a bot commit per change.
    - cron: "0 4 * * *" # every day, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Google throttles GitHub's runner IPs, so most scrapes fail (about 1 in 8
      # succeeded in Aug-Sep 2026). The last successful scrape is carried between runs
      # in the Actions cache; otherwise every failed day rebuilt from the committed
      # copy and the site snapped back to those older counts.
      - name: Restore last Scholar counts 🗄️
        uses: actions/cache/restore@v4
        with:
          path: .scholar-cache
          key: scholar-citations-${{ github.run_id }}
          restore-keys: scholar-citations-

      # Regenerates _data/citations.yml in the runner only -- deliberately never
      # committed, so refreshing counts costs no commits on master. It starts from
      # whichever of the cached and committed copies is newer (so a manual
      # update-citations run still takes effect), and the script exits non-zero
      # without writing if Google throttles the runner, so the build then uses those
      # counts rather than rendering every badge as zero.
      - name: Refresh Scholar citations 🎓
        id: scholar
        continue-on-error: true
        run: |
          cached=.scholar-cache/citations.yml
          if [ -f "$cached" ] && [[ "$(grep -m1 last_updated "$cached")" > "$(grep -m1 last_updated _data/citations.yml)" ]]; then
            cp "$cached" _data/citations.yml
          fi
          pip install -r requirements.txt
          timeout 90 python3 -u bin/update_scholar_citations.py

      # Saved after every run, not just successful ones, so the entry never ages out
      # of the cache however long Google keeps refusing. Jekyll skips dot-directories,
      # so .scholar-cache never reaches _site.
      - name: Stash Scholar counts 🗄️
        run: |
          mkdir -p .scholar-cache && cp _data/citations.yml .scholar-cache/
          if [ "${{ steps.scholar.outcome }}" != "success" ]; then
            echo "::warning::Scholar refresh failed; building with counts from $(grep -m1 last_updated _data/citations.yml | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')"
          fi
      - name: Save Scholar counts 🗄️
        uses: actions/cache/save@v4
        with:
          path: .scholar-cache
          key: scholar-citations-${{ github.run_id }}

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
          # Nav-only stub pages leave unreachable output behind: _pages/photography.md
          # carries an absolute permalink, which Jekyll writes out as a literal
          # "https:/..." directory, and _pages/projects.md is a dropdown parent that
          # never navigates. Both are excluded from the sitemap; drop the stubs too.
          rm -rf "_site/https:" "_site/_pages"
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
