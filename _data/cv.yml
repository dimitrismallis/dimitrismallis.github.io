    Teaching:
      - bullet: |
          **Master/Undergrad students** (collaboration with [Deeplab](https://deeplab.ai/)) · *2022 – 2025*

          Through my ongoing collaboration with Deeplab, I participate in the supervision of master/undergrad students, towards either the completion of their thesis or paper submissions. Part of Deeplab's collaboration with the National Technical University of Athens *(NTUA)*.

