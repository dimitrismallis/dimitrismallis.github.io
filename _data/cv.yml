            - *Deep Learning of 3D Scanned Data* [[Project Page](https://cvi2.uni.lu/2022/06/07/deep-learning-of-3d-scanned-data/)]
            - **CASCADES** — *Constrained Sequence modelling of CAD for reverse Engineering from 3D Scans* [[Project Page](https://cvi2.uni.lu/2022/09/07/cascades/)]
            - **FREE-3D** — *Feature Reverse Engineering Of 3D Scans* [[Project Page](https://cvi2.uni.lu/2022/06/07/free-3d-feature-based-reverse-engineering-of-3d-scans/)]
          - |
            **Research areas**
            - *VLLMs for CAD Design*
            - *Text2CAD*
            - *Reverse Engineering from 3D Scans*
            - *Reverse Engineering of Parametric CAD Sketches*

