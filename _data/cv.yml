        start_date: "2023"
        highlights:
          - Member of the [Computer Vision, Imaging & Machine Intelligence Research Group (CVI²)](https://cvi2.uni.lu/) at [SnT](https://www.uni.lu/snt-en/), [University of Luxembourg](https://www.uni.lu/en/).
