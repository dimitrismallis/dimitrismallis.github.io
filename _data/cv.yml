# CV data in RenderCV format (al-folio v1.x / al_folio_cv).
#
# Migrated from the pre-v1 al-folio schema (`- title: ... type: time_table`),
# which al_folio_cv no longer reads. Field contract per entry type:
#   Experience: position, company, location, start_date, end_date, url, summary, highlights
#   Education:  institution, area, studyType, location, start_date, end_date, url, highlights
#   Awards:     title, awarder, date, summary, url
#   Projects:   name, summary, url, highlights
#   generic:    bullet  (or label + details)
# `summary` and `highlights` are passed through markdownify, so use markdown links.

cv:
